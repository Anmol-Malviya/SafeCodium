services:
  safecodium:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safecodium-app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DEFAULT_AI_PROVIDER=gemini
    volumes:
      - safecodium_data:/app/data
    restart: unless-stopped

volumes:
  safecodium_data:

