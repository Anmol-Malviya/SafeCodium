name: SafeCodium CI

on:
  push:
    branches: [ main, "fix/**", "feature/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Test Suite & Database Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: safecodium_test
          POSTGRES_USER: safecodium
          POSTGRES_PASSWORD: safecodium_secure_pass_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Database Migrations (PostgreSQL)
        env:
          DATABASE_URL: postgresql+asyncpg://safecodium:safecodium_secure_pass_2026@localhost:5432/safecodium_test
        run: |
          python -m alembic upgrade head

      - name: Run Pytest Database Integration & Functional Suite
        env:
          DATABASE_URL: postgresql+asyncpg://safecodium:safecodium_secure_pass_2026@localhost:5432/safecodium_test
        run: |
          python -m pytest backend/tests/test_database_configuration.py backend/tests/test_database_connection.py backend/tests/test_database_migrations.py backend/tests/test_database_crud.py backend/tests/test_database_persistence.py -v

      - name: Run Full Pytest Suite (SQLite Development Mode)
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: |
          python -m pytest backend/tests/test_database_configuration.py backend/tests/test_database_connection.py backend/tests/test_database_migrations.py backend/tests/test_database_crud.py backend/tests/test_database_persistence.py backend/tests/test_auth_rbac.py backend/tests/test_health.py backend/tests/test_cwe_normalizer.py -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci

      - name: Run Frontend Typecheck & Build
        run: |
          npm --prefix frontend run build
